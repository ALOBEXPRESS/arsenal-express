formato:
  saida: auto
  resolucao_horizontal:
  - 1920
  - 1080
  resolucao_vertical:
  - 1080
  - 1920
  fps_saida: 30
cenas:
  modo_timing: 1
  duracao_padrao: 6.6
  excecoes: {}
audio:
  silencio:
    duracao_min: 0.45
    nivel_db: -35
    pausa_alvo: 0.25
